version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: odoo_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logistics_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: node:22-alpine
    container_name: odoo_backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/logistics_db?schema=public
    command: sh -c "corepack enable && pnpm install && npx prisma generate && pnpm dev"
    depends_on:
      - postgres

  frontend:
    image: node:22-alpine
    container_name: odoo_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3001:3000"
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
